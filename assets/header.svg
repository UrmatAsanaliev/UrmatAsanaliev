<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
<style>
.fall{animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,0)}50%{transform:translate(calc(var(--dx)*.5 + 20px),calc(var(--dy)*.5))}100%{transform:translate(var(--dx),var(--dy))}}
.spin{animation:spin linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.star{fill:#fff;animation:tw ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.moon{animation:glow 6s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.85}50%{opacity:1}}
.cloud{animation:drift 60s linear infinite}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(1100px)}}
.fade{opacity:0;animation:fade 1.6s ease-out forwards}
.d2{animation-delay:.6s}.d3{animation-delay:1.2s}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
text{font-family:'Segoe UI','Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif}
</style><defs>
